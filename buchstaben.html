<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Lernreise: Das deutsche Alphabet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- shared design tokens (match the Begrüßung lesson) ---- */
  --cream:#FBF6EC;
  --paper:#FFFDF9;
  --ink:#2B2118;
  --ink-soft:#6b6053;
  --teal:#2f6f76;
  --teal-dark:#1f4d52;
  --teal-light:#eaf3f3;
  --coral:#e8734a;
  --coral-dark:#c85a34;
  --coral-light:#fdece3;
  --gold:#e8b84b;
  --gold-dark:#b9871f;
  --sage:#6f9c85;
  --sage-dark:#4f7b64;
  --sage-light:#e9f3ee;
  --rose:#d9605f;
  --rose-light:#fbe3e0;
  --line:#e7ddc9;
  --radius:18px;
  --shadow:0 10px 26px rgba(43,33,24,0.12);

  /* ---- legacy variable names kept as aliases ----
     (the scene scripts below style themselves with these
     custom properties, so re-pointing them is what re-skins
     every screen without touching the JavaScript) */
  --ink-2:var(--paper);
  --ink-3:#f3ecdc;
  --paper-dim:var(--ink-soft);
  --yellow:var(--gold);
  --yellow-dim:var(--gold-dark);
  --red:var(--rose);
  --green:var(--sage-dark);
  --blue:var(--teal);

  --font-display:'Fredoka', sans-serif;
  --font-body:'Nunito', sans-serif;
  --font-mono:'Nunito', sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1100px 600px at 88% -8%, rgba(232,184,75,0.14), transparent 55%),
    radial-gradient(900px 520px at -8% 108%, rgba(47,111,118,0.10), transparent 55%),
    var(--cream);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:0.2px;}

/* ================= APP SHELL ================= */
#app{
  height:100vh;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

/* ---- progress rail (passport-style header) ---- */
#rail{
  padding:16px clamp(16px,4vw,48px) 12px;
  background:var(--paper);
  border-bottom:3px dashed var(--line);
  box-shadow:0 4px 16px rgba(43,33,24,0.06);
  position:relative;
  z-index:50;
}
#rail-top{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;flex-wrap:wrap;
  margin-bottom:12px;
}
#rail-title{
  font-family:var(--font-body);
  font-weight:800;
  font-size:12px;
  letter-spacing:0.12em;
  text-transform:uppercase;
  color:var(--ink-soft);
}
#rail-title b{color:var(--teal);font-weight:800;}
#scene-counter{
  font-family:var(--font-body);
  font-weight:700;
  font-size:12px;
  color:var(--ink-soft);
  letter-spacing:0.04em;
  white-space:nowrap;
}
#track{
  position:relative;
  height:10px;
  background:var(--teal-light);
  border-radius:999px;
  overflow:hidden;
}
#track-fill{
  position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(90deg,var(--sage),var(--teal));
  border-radius:999px;
  transition:width .5s cubic-bezier(.4,1.4,.6,1);
}
#stops{
  display:flex;justify-content:space-between;
  margin-top:10px;
  gap:2px;
}
.stop{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-family:var(--font-body);
  font-weight:700;
  font-size:10.5px;
  letter-spacing:0.04em;
  color:var(--ink-soft);
  flex:1;
  text-align:center;
}
.stop .dot{
  width:14px;height:14px;border-radius:50%;
  background:var(--paper);
  border:2px solid var(--line);
  transition:all .3s;
}
.stop.done .dot{background:var(--sage);border-color:var(--sage-dark);}
.stop.active .dot{background:var(--gold);border-color:var(--gold-dark);box-shadow:0 0 0 5px rgba(232,184,75,0.22);}
.stop.active{color:var(--ink);}
.stop.done{color:var(--ink-soft);}

/* ---- xp badge ---- */
#xp-badge{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-display);
  font-weight:600;
  font-size:13px;
  color:#5a4413;
  padding:7px 13px;
  border-radius:999px;
  background:linear-gradient(155deg,#fff2cf,var(--gold));
  box-shadow:0 3px 8px rgba(184,135,31,0.35);
  white-space:nowrap;
}
#xp-badge b{font-size:14px;}
#xp-badge.pulse{animation:xppulse .5s ease;}
@keyframes xppulse{0%{transform:scale(1);}40%{transform:scale(1.12);}100%{transform:scale(1);}}

/* ---- stage ---- */
#stage{
  position:relative;
  overflow-y:auto;
  padding:clamp(20px,4vw,56px);
  display:flex;
  align-items:flex-start;
  justify-content:center;
}
.scene{
  width:100%;
  max-width:1100px;
  margin:auto;
  animation:enter .45s cubic-bezier(.2,.8,.2,1);
}
@keyframes enter{
  from{opacity:0;transform:translateY(14px);}
  to{opacity:1;transform:translateY(0);}
}
.eyebrow{
  font-family:var(--font-body);
  font-weight:800;
  font-size:clamp(11px,1.1vw,13px);
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:var(--coral-dark);
  margin:0 0 10px;
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--coral);display:inline-block;flex-shrink:0;}
h1.scene-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(26px,4.2vw,44px);
  line-height:1.12;
  margin:0 0 14px;
  letter-spacing:-0.005em;
  color:var(--ink);
}
p.lead{
  font-size:clamp(15px,1.6vw,17px);
  line-height:1.55;
  color:var(--ink-soft);
  max-width:64ch;
  margin:0 0 26px;
}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  padding:13px 22px;
  border-radius:14px;
  border:1.5px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .15s, background .15s, border-color .15s, box-shadow .15s;
  min-height:46px;
}
.btn:hover{transform:translateY(-2px);border-color:var(--teal);}
.btn:active{transform:translateY(0) scale(0.97);}
.btn.primary{
  background:linear-gradient(155deg,var(--coral),var(--coral-dark));
  color:#fff;
  border-color:transparent;
  box-shadow:0 5px 14px rgba(200,90,52,0.35);
}
.btn.primary:hover{filter:brightness(1.05);}
.btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal-dark);}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none;}
.btn.correct{background:var(--sage)!important;color:#fff!important;border-color:transparent!important;}
.btn.wrong{background:var(--rose)!important;color:#fff!important;border-color:transparent!important;}

/* ---- bottom nav ---- */
#nav{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;
  padding:14px clamp(16px,4vw,48px);
  border-top:1px solid var(--line);
  background:var(--paper);
  box-shadow:0 -6px 18px rgba(43,33,24,0.05);
}
#nav .side{display:flex;gap:10px;}
#nav-progress-label{
  font-family:var(--font-body);
  font-weight:700;
  font-size:12px;
  color:var(--ink-soft);
  letter-spacing:.06em;
  text-align:center;
  flex:1;
}

/* ---- mascot ---- */
#mascot{
  position:fixed;
  right:clamp(14px,3vw,34px);
  bottom:92px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  z-index:50;
  max-width:min(340px,80vw);
  pointer-events:none;
}
#mascot-bubble{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-weight:700;
  font-size:14px;
  line-height:1.4;
  padding:12px 15px;
  border-radius:14px 14px 4px 14px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  max-width:260px;
  transform-origin:bottom right;
  animation:pop .3s cubic-bezier(.2,.8,.2,1);
}
#mascot-bubble.mood-success{background:var(--sage-light);border-color:var(--sage);color:var(--sage-dark);}
#mascot-bubble.mood-error{background:var(--rose-light);border-color:var(--rose);color:var(--rose);}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
#mascot-avatar{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(155deg,#ffd9a8,var(--coral));
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  box-shadow:0 6px 14px rgba(200,90,52,0.35);
  flex-shrink:0;
  animation:lexi-float 3.2s ease-in-out infinite;
}
@keyframes lexi-float{
  0%,100%{transform:translateY(0) rotate(-3deg);}
  50%{transform:translateY(-4px) rotate(3deg);}
}
#mascot-avatar.talking{animation:lexi-talk .35s ease-in-out infinite;}
@keyframes lexi-talk{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

/* ================= FLAP TILE (signature element) ================= */
.flap-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(76px,1fr));
  gap:10px;
}
.flap{
  position:relative;
  aspect-ratio:3/4;
  perspective:600px;
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
}
.flap-face{
  position:absolute;inset:0;
  background:var(--paper);
  border:1.5px solid var(--line);
  border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font-display);
  box-shadow:0 2px 6px rgba(43,33,24,0.06);
  transition:transform .18s, border-color .18s, background .18s;
}
.flap-letter{
  font-size:clamp(22px,2.6vw,30px);
  font-weight:600;
  color:var(--teal-dark);
}
.flap-name{
  font-size:10px;
  color:var(--ink-soft);
  margin-top:4px;
  opacity:0;
  transition:opacity .3s;
  letter-spacing:.04em;
}
.flap.discovered .flap-face{background:var(--sage-light);border-color:var(--sage);}
.flap.discovered .flap-name{opacity:1;}
.flap.discovered .flap-letter{color:var(--sage-dark);}
.flap.flipping .flap-face{animation:flapdown .42s ease;}
@keyframes flapdown{
  0%{transform:rotateX(0);}
  45%{transform:rotateX(85deg);}
  55%{transform:rotateX(85deg);}
  100%{transform:rotateX(0);}
}
.flap-sound{
  position:absolute;bottom:6px;right:6px;
  font-size:10px;color:var(--teal);opacity:.85;
}

/* ---- utility layouts ---- */
.row-wrap{display:flex;flex-wrap:wrap;gap:12px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.chip{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  padding:11px 18px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
  transition:all .15s;
}
.chip:hover{border-color:var(--teal);transform:translateY(-2px);}
.chip.selected{border-color:var(--coral);background:var(--coral-light);transform:scale(1.04);}
.chip.matched{background:var(--sage);color:#fff;border-color:transparent;cursor:default;transform:none;}
.chip.locked{opacity:.4;cursor:default;}
.chip.wrong{border-color:var(--rose);background:var(--rose-light);animation:shake .35s;}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  75%{transform:translateX(5px);}
}

.pill-counter{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-body);
  font-weight:700;
  font-size:12.5px;
  padding:7px 14px;
  border-radius:999px;
  background:var(--cream);
  border:1.5px solid var(--line);
  color:var(--ink-soft);
  margin-bottom:18px;
}
.pill-counter b{color:var(--coral-dark);}

.text-input{
  font-family:var(--font-display);
  font-size:18px;
  padding:12px 16px;
  border-radius:12px;
  border:1.5px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  width:100%;
  max-width:280px;
}
.text-input:focus{outline:none;border-color:var(--teal);}

.exam-progress{font-family:var(--font-body);font-weight:700;font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;letter-spacing:.04em;}

.goal-list{list-style:none;margin:0 auto 26px;padding:0;max-width:520px;text-align:left;}
.goal-list li{display:flex;align-items:flex-start;gap:10px;padding:10px 0;font-size:14.5px;color:var(--ink-soft);border-bottom:1px solid var(--line);}
.goal-list li:last-child{border-bottom:none;}
.goal-list li::before{content:"✓";color:#fff;background:var(--sage);border-radius:50%;width:20px;height:20px;flex-shrink:0;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}

.sub-hint{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}

.progressbar-mini{height:8px;background:var(--teal-light);border-radius:999px;overflow:hidden;margin-bottom:20px;}
.progressbar-mini > div{height:100%;background:linear-gradient(90deg,var(--sage),var(--teal));transition:width .4s;}

.big-badge{
  width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--gold),var(--coral),var(--sage),var(--teal),var(--gold));
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;
  box-shadow:var(--shadow);
  position:relative;
}
.big-badge::before{
  content:"";
  position:absolute;inset:8px;
  border-radius:50%;
  background:var(--paper);
}
.big-badge span{
  position:relative;
  font-family:var(--font-display);
  font-weight:700;
  font-size:15px;
  text-align:center;
  line-height:1.2;
  color:var(--ink);
}

/* ================= BEGRÜSSUNG: DIALOG-SZENE ================= */
.dialog-hint-box{
  font-family:var(--font-body);font-weight:800;font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-soft);text-align:center;margin-bottom:4px;
}
.dialog-stage{
  display:flex;align-items:flex-end;justify-content:center;
  gap:clamp(28px,10vw,140px);
  padding:56px 10px 14px;
  position:relative;
}
.dialog-person{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  position:relative;width:130px;
}
.dialog-avatar{
  width:84px;height:84px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
  background:linear-gradient(155deg,#dceeff,var(--teal));
  border:2px solid var(--line);
  box-shadow:var(--shadow);
  transition:transform .25s, border-color .25s, box-shadow .25s;
  animation:sway 3.4s ease-in-out infinite;
}
.dialog-person.b .dialog-avatar{animation-delay:1.15s;background:linear-gradient(155deg,#ffe1ea,var(--rose));}
@keyframes sway{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-5px) rotate(-2deg);}}
.dialog-avatar.speaking{
  border-color:var(--gold);
  transform:scale(1.08);
  box-shadow:0 0 0 7px rgba(232,184,75,.22);
}
.dialog-name{font-family:var(--font-display);font-weight:600;font-size:12.5px;color:var(--ink-soft);letter-spacing:.02em;}
.dialog-bubble{
  position:absolute;top:-58px;left:50%;transform:translateX(-50%);
  background:var(--paper);color:var(--ink);
  font-family:var(--font-body);font-weight:700;font-size:14px;
  padding:10px 14px;border-radius:14px;
  border:1.5px solid var(--line);
  box-shadow:var(--shadow);
  min-width:100px;max-width:220px;text-align:center;
  opacity:0;transition:opacity .2s;
  pointer-events:none;
}
.dialog-bubble::after{
  content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  border-width:7px 7px 0 7px;border-style:solid;border-color:var(--paper) transparent transparent transparent;
}
.dialog-bubble.show{opacity:1;}
.dialog-controls{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px;}
.dialog-status{font-family:var(--font-body);font-weight:700;font-size:12.5px;color:var(--ink-soft);letter-spacing:.02em;min-height:18px;margin-bottom:6px;}
.comprehension-box{
  margin-top:20px;padding:18px 20px;
  animation:enter .4s cubic-bezier(.2,.8,.2,1);
}
.comprehension-box .q{font-family:var(--font-display);font-weight:700;font-size:19px;margin-bottom:4px;color:var(--ink);}

/* ================= BEGRÜSSUNG: WORT-KARTEN ================= */
.word-grid{display:flex;flex-wrap:wrap;gap:10px;}
.word-card{
  font-family:var(--font-display);font-weight:600;font-size:14px;
  padding:12px 17px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  cursor:pointer;transition:all .15s;
}
.word-card:hover{border-color:var(--teal);transform:translateY(-2px);}
.word-card.correct{background:var(--sage)!important;color:#fff!important;border-color:transparent;cursor:default;}
.word-card.wrong{background:var(--rose)!important;color:#fff!important;border-color:transparent;}
.word-card.locked{opacity:.5;cursor:default;}

/* ================= BEGRÜSSUNG: BEDEUTUNGS-KARTEN ================= */
.meaning-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.meaning-card{padding:20px 16px;text-align:center;cursor:pointer;transition:border-color .15s, transform .15s;}
.meaning-card:hover{transform:translateY(-2px);border-color:var(--teal);}
.meaning-card .emo{font-size:36px;margin-bottom:10px;}
.meaning-card .phrase{font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:0;color:var(--ink);}
.meaning-card .desc{font-size:12.5px;color:var(--ink-soft);max-height:0;opacity:0;overflow:hidden;transition:all .3s;}
.meaning-card.open{border-color:var(--sage);background:var(--sage-light);}
.meaning-card.open .desc{max-height:120px;opacity:1;margin-top:8px;}

/* ================= BEGRÜSSUNG: SORTIER-ZONEN ================= */
.zone-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
.zone-card{padding:20px;text-align:center;min-height:120px;transition:border-color .15s, background .15s;}
.zone-card.target-active{border-color:var(--gold);background:var(--coral-light);}
.zone-card h3{margin:0 0 12px;font-family:var(--font-display);font-size:17px;color:var(--ink);}
.zone-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:30px;}
.zone-list .tag{background:var(--sage);color:#fff;padding:6px 12px;border-radius:8px;font-family:var(--font-display);font-size:13px;font-weight:600;}

/* ================= BEGRÜSSUNG: CHAT / LEXI-BEGEGNUNG ================= */
.chat-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px;}
.chat-row.user{flex-direction:row-reverse;}
.chat-avatar{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:17px;
  background:linear-gradient(155deg,#ffd9a8,var(--coral));
}
.chat-avatar.user{background:var(--cream);border:1px solid var(--line);}
.chat-bubble{background:var(--paper);border:1.5px solid var(--line);padding:10px 14px;border-radius:12px 12px 12px 4px;font-size:14px;max-width:60ch;line-height:1.45;color:var(--ink);}
.chat-row.user .chat-bubble{background:var(--teal-light);border-radius:12px 12px 4px 12px;}

/* ================= BEGRÜSSUNG: MISSION-STORY ================= */
.mission-step{padding:18px 20px;margin-bottom:14px;transition:opacity .2s, border-color .2s;}
.mission-step.pending{opacity:.45;}
.mission-step.done{border-color:var(--sage);background:var(--sage-light);}
.mission-step .step-label{font-family:var(--font-body);font-weight:800;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:6px;}
.mission-step .step-prompt{font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:12px;color:var(--ink);}

@media (max-width:900px){

let state = initialState();

function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=0.82;
    speechSynthesis.speak(u);
  }catch(e){}
}

function setMascot(text, mood){
  const bubble = document.getElementById('mascot-bubble');
  bubble.className='';
  bubble.style.animation='none';
  requestAnimationFrame(()=>{
    bubble.style.animation='';
    if(mood) bubble.classList.add('mood-'+mood);
    bubble.textContent = text;
  });
}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============================================================
   XP SYSTEM
   awardXP ist idempotent pro id, damit nichts doppelt zählt.
============================================================ */
function awardXP(id, amount){
  if(state.xpAwarded[id]) return;
  state.xpAwarded[id] = true;
  state.xp += amount;
  updateXPDisplay(true);
}
function updateXPDisplay(pulse){
  const val = document.getElementById('xp-value');
  if(val) val.textContent = state.xp;
  if(pulse){
    const badge = document.getElementById('xp-badge');
    if(badge){
      badge.classList.remove('pulse');
      void badge.offsetWidth;
      badge.classList.add('pulse');
    }
    const avatar = document.getElementById('mascot-avatar');
    if(avatar){
      avatar.classList.add('talking');
      setTimeout(()=>avatar.classList.remove('talking'), 450);
    }
  }
}

/* ============================================================
   ABSCHLUSSPRÜFUNG: Fragen-Generator
   Deckt ab: Buchstaben erkennen, Groß-/Kleinschreibung,
   Hören, Buchstabe-Wort, fehlende Buchstaben, Buchstabieren.
============================================================ */
function buildExamQuestions(){
  const qs = [];
  const rndLetters = (exclude, n)=> shuffle(ALPHABET.filter(a=>!exclude.includes(a.l))).slice(0,n).map(a=>a.l);

  // 1) Buchstaben erkennen (Name hören, Buchstabe wählen)
  let a = shuffle(ALPHABET)[0];
  qs.push({type:'choice', title:'Buchstaben erkennen', prompt:'Welcher Buchstabe ist das?', audio:a.l,
    options:shuffle([a.l, ...rndLetters([a.l],3)]), answer:a.l, reveal:a.l});

  // 2) Groß-/Kleinschreibung
  let b = shuffle(ALPHABET)[0];
  const wrongLower = shuffle(ALPHABET.filter(x=>x.l!==b.l)).slice(0,3).map(x=>x.s);
  qs.push({type:'choice', title:'Groß- und Kleinbuchstaben', prompt:`Welcher Kleinbuchstabe gehört zu „${b.l}“?`,
    options:shuffle([b.s, ...wrongLower]), answer:b.s, reveal:b.s});

  // 3) Hören – Kontrastpaar
  const pair = shuffle(CONTRAST_PAIRS)[0];
  const target = shuffle(pair)[0];
  const partner = pair.find(l=>l!==target);
  const others = rndLetters([target,partner],2);
  qs.push({type:'choice', title:'Genau hinhören', prompt:'Welchen Buchstaben hörst du?', audio:target,
    options:shuffle([target,partner,...others]), answer:target, reveal:target});

  // 4) Buchstabe → Wort
  const wp = shuffle(WORD_PAIRS)[0];
  const wrongWords = shuffle(WORD_PAIRS.filter(p=>p.l!==wp.l)).slice(0,3).map(p=>p.w);
  qs.push({type:'choice', title:'Buchstabe und Wort', prompt:`„${wp.l}“ – welches Wort passt?`,
    options:shuffle([wp.w, ...wrongWords]), answer:wp.w, reveal:wp.w});

  // 5) Fehlender Buchstabe in der Reihenfolge
  const idx = 2 + Math.floor(Math.random()*20); // vermeidet Rand
  const seqLetters = ALPHABET.map(x=>x.l);
  const missing = seqLetters[idx];
  const before = seqLetters[idx-1], after = seqLetters[idx+1];
  const seqOptions = shuffle([missing, ...rndLetters([missing,before,after],3)]);
  qs.push({type:'choice', title:'Fehlender Buchstabe', prompt:`Welcher Buchstabe fehlt? … ${before} – _ – ${after} …`,
    options:seqOptions, answer:missing, reveal:missing});

  // 6) noch eine Groß-/Kleinschreibung-Frage
  let c = shuffle(ALPHABET.filter(x=>x.l!==b.l))[0];
  const wrongLower2 = shuffle(ALPHABET.filter(x=>x.l!==c.l)).slice(0,3).map(x=>x.s);
  qs.push({type:'choice', title:'Groß- und Kleinbuchstaben', prompt:`Welcher Kleinbuchstabe gehört zu „${c.l}“?`,
    options:shuffle([c.s, ...wrongLower2]), answer:c.s, reveal:c.s});

  // 7) Buchstabe → Wort (zweite Runde)
  const wp2 = shuffle(WORD_PAIRS.filter(p=>p.l!==wp.l))[0];
  const wrongWords2 = shuffle(WORD_PAIRS.filter(p=>p.l!==wp2.l)).slice(0,3).map(p=>p.w);
  qs.push({type:'choice', title:'Buchstabe und Wort', prompt:`„${wp2.l}“ – welches Wort passt?`,
    options:shuffle([wp2.w, ...wrongWords2]), answer:wp2.w, reveal:wp2.w});

  // 8) Hören – zweite Runde
  const pair2 = shuffle(CONTRAST_PAIRS)[0];
  const target2 = shuffle(pair2)[0];
  const partner2 = pair2.find(l=>l!==target2);
  const others2 = rndLetters([target2,partner2],2);
  qs.push({type:'choice', title:'Genau hinhören', prompt:'Welchen Buchstaben hörst du?', audio:target2,
    options:shuffle([target2,partner2,...others2]), answer:target2, reveal:target2});

  // 9) Sonderzeichen erkennen
  const sp = shuffle(SPECIAL)[0];
  const wrongSpecial = shuffle(SPECIAL.filter(s=>s.l!==sp.l)).map(s=>s.l);
  qs.push({type:'choice', title:'Ä, Ö, Ü, ß erkennen', prompt:`Welches Zeichen passt zum Beispielwort „${sp.example}“?`,
    options:shuffle([sp.l, ...wrongSpecial]), answer:sp.l, reveal:sp.l});

  // 10) Ein einfaches Wort buchstabieren
  const examWord = shuffle(['TÜR','BUS','NAME','KINO'])[0];
  qs.push({type:'spell', title:'Wort buchstabieren', prompt:`Buchstabiere das Wort: „${examWord}“`, word:examWord});

  return qs;
}
function examFeedback(score,total){
  const ratio = score/total;
  if(ratio>=0.8) return 'Ausgezeichnet! Du kennst jetzt die wichtigsten Grundlagen des deutschen Alphabets sehr sicher.';
  if(ratio>=0.5) return 'Gut gemacht! Du kennst schon viele Grundlagen des deutschen Alphabets. Übung macht den Meister.';
  return 'Guter Start! Geh gerne noch einmal zurück und wiederhole die Übungen – das hilft dir sehr.';
}

        </div>
        <div class="row-wrap" id="name-bank"></div>
        <p class="lead" id="name-feedback" style="margin-top:14px;min-height:20px;"></p>
      `;
      const renderSlots = ()=>{
        box.querySelector('#name-slots').textContent = word.split('').map((c,i)=> i<state.nameProgress.length ? c : '_').join(' ');
      };
      renderSlots();
      const bank = box.querySelector('#name-bank');
      shuffle(word.split('')).forEach(c=>{
        const chip=document.createElement('button');
        chip.className='chip';
        chip.textContent=c;
        chip.onclick=()=>{
          const expected = word[state.nameProgress.length];
          if(c===expected && !chip.classList.contains('matched')){
            chip.classList.add('matched');
            state.nameProgress += c;
            renderSlots();
            if(state.nameProgress===word){
              setMascot('Perfekt buchstabiert! So schreibt man deinen Namen.', 'success');
              speak(word);
              awardXP('namespell', 10);
            } else {
              setMascot('Sehr gut! Weiter so.', 'success');

            chip.classList.add('wrong');
            setTimeout(()=>chip.classList.remove('wrong'),400);
            setMascot('Versuch es noch einmal!', 'error');
          }
        };
        bank.appendChild(chip);
      });

    root.querySelector('#name-go').onclick = startSpelling;
    if(state.nameStarted) renderActivity();
    if(!state.nameStarted) setMascot('Gib einen Namen ein – dann üben wir das Buchstabieren gemeinsam.');

/* ---------------- 8c: ABSCHLUSSPRÜFUNG ---------------- */
{
  id:'exam', stage:'MISSION',
  render(root){
    if(!state.exam.questions){
      state.exam.questions = buildExamQuestions();
      state.exam.index = 0;
      state.exam.score = 0;
      state.exam.locked = false;
    }
    const total = state.exam.questions.length;
    if(state.exam.index >= total){
      root.innerHTML = `
        <div class="eyebrow">Mission &middot; Abschlussprüfung</div>
        <h1 class="scene-title">Prüfung abgeschlossen!</h1>
        <p class="lead">Du hast <strong style="color:var(--ink);">${state.exam.score} / ${total}</strong> Aufgaben richtig gelöst.</p>
        <p class="lead">${examFeedback(state.exam.score,total)}</p>
      `;
      setMascot(state.exam.score>=total*0.7 ? 'Sehr gut! Du kennst jetzt die wichtigsten Grundlagen des deutschen Alphabets.' : 'Gut gemacht! Übung macht den Meister – du kannst jederzeit zurückgehen und wiederholen.', 'success');
      if(!state.exam.xpGiven){
        state.exam.xpGiven = 1;
        awardXP('exam', state.exam.score*5);
      }
      return;
    }
    const q = state.exam.questions[state.exam.index];
    root.innerHTML = `
      <div class="eyebrow">Mission &middot; Abschlussprüfung</div>
      <h1 class="scene-title">${q.title}</h1>
      <div class="exam-progress">Aufgabe ${state.exam.index+1} / ${total} &middot; Richtig: ${state.exam.score}</div>
      <p class="lead">${q.prompt}</p>
      <div id="exam-body"></div>
      <p class="lead" id="exam-feedback" style="margin-top:14px;min-height:20px;"></p>
      <div class="row-wrap" style="margin-top:10px;">
        <button class="btn primary" id="exam-continue" style="display:none;">Weiter →</button>
      </div>
    `;
    const body = root.querySelector('#exam-body');
    const feedback = root.querySelector('#exam-feedback');
    const continueBtn = root.querySelector('#exam-continue');
    const finishQuestion = (correct)=>{
      if(correct){
        state.exam.score++;
        feedback.textContent = 'Richtig!';
        setMascot('Sehr gut!', 'success');
      } else {
        feedback.textContent = q.reveal ? `Nicht ganz. Richtig war: ${q.reveal}` : 'Nicht ganz. Weiter geht’s!';
        setMascot('Hör noch einmal genau hin.', 'error');
      }
      continueBtn.style.display='inline-flex';
      continueBtn.onclick = ()=>{ state.exam.index++; this.render(root); };
    };

    if(q.type==='choice'){
      if(q.audio) speak(q.audio);
      const box = document.createElement('div');
      box.className='row-wrap';
      q.options.forEach(opt=>{
        const b=document.createElement('button');
        b.className='btn';
        b.textContent=opt;
        b.onclick=()=>{
          if(state.exam.locked) return;
          state.exam.locked=true;
          [...box.children].forEach(c=>c.disabled=true);
          const ok = opt===q.answer;
          b.classList.add(ok?'correct':'wrong');
          if(!ok){
            const okBtn=[...box.children].find(c=>c.textContent===q.answer);
            if(okBtn) okBtn.classList.add('correct');
          }
          finishQuestion(ok);
          state.exam.locked=false;
        };
        box.appendChild(b);
      });
      if(q.audio){
        const playBtn=document.createElement('button');
        playBtn.className='btn'; playBtn.style.marginBottom='16px';
        playBtn.textContent='🔊 Noch einmal hören';
        playBtn.onclick=()=>speak(q.audio);
        body.appendChild(playBtn);
      }
      body.appendChild(box);
    }

    if(q.type==='spell'){
      const word = q.word;
      let progress='';
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div class="card" style="padding:22px;margin-bottom:20px;">
          <div id="exam-slots" style="font-family:var(--font-mono);font-size:30px;letter-spacing:.15em;">${word.split('').map(()=>'_').join(' ')}</div>
        </div>
        <div class="row-wrap" id="exam-bank"></div>
      `;
      body.appendChild(wrap);
      const slots = wrap.querySelector('#exam-slots');
      const bank = wrap.querySelector('#exam-bank');
      shuffle(word.split('')).forEach(c=>{
        const chip=document.createElement('button');
        chip.className='chip';
        chip.textContent=c;
        chip.onclick=()=>{
          const expected = word[progress.length];
          if(c===expected && !chip.classList.contains('matched')){
            chip.classList.add('matched');
            progress+=c;
            slots.textContent = word.split('').map((ch,i)=> i<progress.length?ch:'_').join(' ');
            if(progress===word){ speak(word); finishQuestion(true); }
          } else if(!chip.classList.contains('matched')){
            chip.classList.add('wrong');
            setTimeout(()=>chip.classList.remove('wrong'),400);
          }
        };
        bank.appendChild(chip);
      });
    }
  }
},

const GREET_SCENES = [

/* ---------------- 1: DIALOG (HÖREN) ---------------- */
{
  id:'greet-dialog', stage:'HÖREN',
  render(root){
    const g = state.greet;
    root.innerHTML = `
      <div class="eyebrow">Hören &middot; Szene 1</div>
      <h1 class="scene-title">👋 Begrüßung – ein kurzer Dialog</h1>
      <div class="dialog-hint-box">👀 Hör zu und beobachte</div>

      <div class="card">
        <div class="dialog-stage">
          <div class="dialog-person a">
            <div class="dialog-bubble" id="bubble-a"></div>
            <div class="dialog-avatar" id="avatar-a">👩</div>
            <div class="dialog-name">Anna</div>
          </div>
          <div class="dialog-person b">
            <div class="dialog-bubble" id="bubble-b"></div>
            <div class="dialog-avatar" id="avatar-b">👨</div>
            <div class="dialog-name">Ali</div>
          </div>
        </div>
      </div>

      <div class="dialog-controls">
        <button class="btn primary" id="d-start">▶️ Start</button>
        <button class="btn ghost" id="d-pause">⏸️ Pause</button>
        <button class="btn ghost" id="d-replay">🔄 Nochmal</button>
        <button class="btn" id="d-listen">🔊 Dialog anhören</button>
      </div>
      <div class="comprehension-box card" id="comprehension" style="display:${g.dialogPlayed?'block':'none'};">
        <div class="q">Was hast du verstanden? 👀</div>
        <p class="lead" style="margin:6px 0 0;">Sehr gut! Klick unten auf „Weiter“ – als Nächstes findest du heraus, welche Wörter du gehört hast.</p>
      </div>
    `;
    const bubbleA = root.querySelector('#bubble-a');
    const bubbleB = root.querySelector('#bubble-b');
    const avatarA = root.querySelector('#avatar-a');
    const avatarB = root.querySelector('#avatar-b');
    const statusEl = root.querySelector('#dialog-status');
    const comprehension = root.querySelector('#comprehension');

    const resetVisual = ()=>{
      bubbleA.classList.remove('show'); bubbleB.classList.remove('show');
      avatarA.classList.remove('speaking'); avatarB.classList.remove('speaking');
    };

    const playFrom = (i)=>{
      if(g.dialogPaused) return;
      if(i>=GREET_DIALOG.length){
        g.dialogPlaying=false; g.dialogPlayed=true; g.dialogNextIndex=0;
        resetVisual();
        statusEl.textContent = 'Dialog beendet. Du kannst ihn dir gerne noch einmal ansehen.';
        comprehension.style.display='block';
        awardXP('greet-dialog',5);
        setMascot('Toll zugehört! Was hast du verstanden?', 'success');
        return;
      }
      g.dialogNextIndex = i;
      const line = GREET_DIALOG[i];
      const isA = line.who==='a';
      const bubble = isA?bubbleA:bubbleB;
      const other = isA?bubbleB:bubbleA;
      other.classList.remove('show');
      bubble.textContent = line.text;
      bubble.classList.add('show');
      avatarA.classList.toggle('speaking', isA);
      avatarB.classList.toggle('speaking', !isA);
      statusEl.textContent = (isA?'Anna':'Ali') + ' spricht …';
      speak(line.text);
      const duration = Math.max(1200, line.text.length*95);
      g.dialogTimer = setTimeout(()=>{ g.dialogNextIndex=i+1; playFrom(i+1); }, duration);
    };

    const start = ()=>{
      if(g.dialogPlaying) return;
      clearTimeout(g.dialogTimer);
      g.dialogPlaying = true; g.dialogPaused = false;
      comprehension.style.display='none';
      playFrom(g.dialogNextIndex||0);
    };
    root.querySelector('#d-start').onclick = start;
    root.querySelector('#d-listen').onclick = start;
    root.querySelector('#d-pause').onclick = ()=>{
      g.dialogPaused = true; g.dialogPlaying=false;
      clearTimeout(g.dialogTimer);
      try{ speechSynthesis.cancel(); }catch(e){}
      statusEl.textContent = 'Pausiert. Klick auf ▶️ Start, um weiterzumachen.';
    };
    root.querySelector('#d-replay').onclick = ()=>{
      clearTimeout(g.dialogTimer);
      g.dialogPaused=false; g.dialogPlaying=true; g.dialogNextIndex=0;
      resetVisual();
      comprehension.style.display='none';
      playFrom(0);
    };
    if(!g.dialogPlayed) setMascot('Hallo! Willkommen zur nächsten Einheit. Schau dir zuerst den Dialog an – du brauchst noch keine Vokabelliste!');
    else setMascot('Willst du den Dialog noch einmal sehen, oder geht es weiter?');
  }
},

        bank.appendChild(chip);
      });
      zoneB.classList.toggle('target-active', !!g.sortSelected);
      zoneV.classList.toggle('target-active', !!g.sortSelected);
    };
    const renderZones = ()=>{
      listB.innerHTML=''; listV.innerHTML='';
      GREET_SORT_WORDS.filter(i=>g.sortPlaced.has(i.w) && i.cat==='begruessen').forEach(i=>{
        const t=document.createElement('span'); t.className='tag'; t.textContent=i.w; listB.appendChild(t);

      if(!g.sortSelected) { feedback.textContent='Wähle zuerst ein Wort aus.'; return; }

  render(root){
    const g = state.greet;
    if(g.situationRound>=GREET_SITUATIONS.length){
      root.innerHTML = `
        <div class="eyebrow">Verstehen &middot; Szene 5</div>
        <h1 class="scene-title">Geschafft!</h1>
        <p class="lead">Du hast <strong style="color:var(--ink);">${g.situationScore}/${GREET_SITUATIONS.length}</strong> Situationen richtig gelöst.</p>
      `;
      setMascot('Gut gemacht! Weiter geht’s mit „Weiter →“.', 'success');
      return;
    }
    const s = GREET_SITUATIONS[g.situationRound];
    root.innerHTML = `
      <div class="eyebrow">Verstehen &middot; Szene 5 &middot; ${g.situationRound+1}/${GREET_SITUATIONS.length}</div>
      <h1 class="scene-title">Welche Begrüßung passt?</h1>
      <div class="card" style="padding:26px;text-align:center;max-width:420px;margin-bottom:20px;">
        <div style="font-size:52px;margin-bottom:12px;">${s.emo}</div>
        <p class="lead" style="margin:0;">${s.text}</p>
      </div>
      <div class="row-wrap" id="sit-options"></div>
      <p class="lead" id="sit-feedback" style="margin-top:16px;min-height:20px;"></p>
    `;
    const box = root.querySelector('#sit-options');
    const feedback = root.querySelector('#sit-feedback');
    s.options.forEach(opt=>{
      const b = document.createElement('button');
      b.className='btn';
      b.textContent=opt;
      b.onclick = ()=>{
        if(g.situationLocked) return;
        g.situationLocked = true;
        [...box.children].forEach(c=>c.disabled=true);
        const ok = opt===s.answer;
        b.classList.add(ok?'correct':'wrong');
        if(!ok){
          const okBtn=[...box.children].find(c=>c.textContent===s.answer);
          if(okBtn) okBtn.classList.add('correct');
        }
        if(ok){ g.situationScore++; feedback.textContent='Richtig! ⭐'; setMascot('Richtig! ⭐','success'); }
        else { feedback.textContent='Nicht ganz. Richtig ist: '+s.answer; setMascot('Nicht ganz. Hör genau hin.','error'); }
        setTimeout(()=>{
          g.situationRound++; g.situationLocked=false;
          if(g.situationRound===GREET_SITUATIONS.length) awardXP('greet-situation',10);
          this.render(root);
        }, 900);
      };
      box.appendChild(b);
    });
    setMascot('Welche Antwort passt zur Situation?');
  }
},

{

        btn.classList.add(ok?'correct':'wrong');

/* ---------------- 7: MINI-DIALOG (ÜBEN) ---------------- */
{
  id:'greet-minidialog', stage:'ÜBEN',
  render(root){
    const g = state.greet;
    root.innerHTML = `
      <div class="eyebrow">Üben &middot; Szene 7</div>
      <h1 class="scene-title">Ergänze den Mini-Dialog</h1>
      <p class="lead">Wähle die passende Antwort für jede Sprechblase.</p>
      <div class="card" style="padding:22px;margin-bottom:18px;">
        <div id="mini-transcript" style="font-family:var(--font-mono);font-size:14px;line-height:2.1;"></div>
      </div>
      <div id="mini-options"></div>
    `;
    const transcript = root.querySelector('#mini-transcript');
    const optionsBox = root.querySelector('#mini-options');

    const renderTranscript = ()=>{
      transcript.innerHTML = GREET_MINIDIALOG.map((line,i)=>{
        const filled = i<g.minidialogStep;
        return `<div><b style="color:var(--yellow);">${line.speaker}:</b> ${filled? line.answer : (i===g.minidialogStep? '______' : '…')}</div>`;
      }).join('');
    };
    const renderOptions = ()=>{
      optionsBox.innerHTML='';
      if(g.minidialogStep>=GREET_MINIDIALOG.length){
        optionsBox.innerHTML = `<p class="lead">Sehr gut! Der Dialog ist komplett. ✅</p>`;
        if(!g.minidialogDone){ g.minidialogDone=true; awardXP('greet-minidialog',10); setMascot('Perfekt! Du hast den Dialog richtig ergänzt.','success'); }
        return;
      }
      const line = GREET_MINIDIALOG[g.minidialogStep];
      const p = document.createElement('p');
      p.className='lead'; p.textContent = line.prompt;
      optionsBox.appendChild(p);
      const box = document.createElement('div');
      box.className='row-wrap';
      shuffle(line.options).forEach(opt=>{
        const b=document.createElement('button');
        b.className='btn'; b.textContent=opt;
        b.onclick=()=>{
          const ok = opt===line.answer;
          if(ok){
            b.classList.add('correct');
            setMascot('Richtig! ⭐','success');
            setTimeout(()=>{ g.minidialogStep++; renderTranscript(); renderOptions(); speak(line.answer); },500);
          } else {
            b.classList.add('wrong');
            setMascot('Hör noch einmal genau hin. 👂','error');
            setTimeout(()=>b.classList.remove('wrong'),450);
          }
        };
        box.appendChild(b);
      });
      optionsBox.appendChild(box);
    };
    renderTranscript(); renderOptions();
    setMascot('Ergänze die Lücken – wähle die richtige Antwort!');
  }
},

/* ---------------- 8: ROLLENSPIEL (SPRECHEN) ---------------- */
{
  id:'greet-roleplay', stage:'SPRECHEN',
  render(root){
    const g = state.greet;
    root.innerHTML = `
      <div class="eyebrow">Sprechen &middot; Szene 8</div>
      <h1 class="scene-title">Rollenspiel: Du bist Person B</h1>
      <p class="lead">Person A spricht zu dir. Wähle deine Antwort und sprich mit!</p>
      <div class="card">
        <div class="dialog-stage" style="padding-top:56px;">
          <div class="dialog-person a">
            <div class="dialog-bubble" id="rp-bubble-a"></div>
            <div class="dialog-avatar" id="rp-avatar-a">👩</div>
            <div class="dialog-name">Person A</div>
          </div>
          <div class="dialog-person b">
            <div class="dialog-bubble" id="rp-bubble-b"></div>
            <div class="dialog-avatar" id="rp-avatar-b">🧑</div>
            <div class="dialog-name">Du</div>
          </div>
        </div>
      </div>
      <div id="rp-options" style="margin-top:18px;"></div>
    `;
    const bubbleA = root.querySelector('#rp-bubble-a');
    const bubbleB = root.querySelector('#rp-bubble-b');
    const avatarA = root.querySelector('#rp-avatar-a');
    const avatarB = root.querySelector('#rp-avatar-b');
    const optionsBox = root.querySelector('#rp-options');

    const showStep = ()=>{
      if(g.roleplayStep>=GREET_ROLEPLAY.length){
        optionsBox.innerHTML = `<p class="lead">Super gemacht! Das Gespräch ist zu Ende. ✅</p>`;
        bubbleA.classList.remove('show'); bubbleB.classList.remove('show');
        avatarA.classList.remove('speaking'); avatarB.classList.remove('speaking');
        if(!g.roleplayDone){ g.roleplayDone=true; awardXP('greet-roleplay',10); setMascot('Klasse! Du kannst jetzt ein Gespräch führen.','success'); }
        return;
      }
      const step = GREET_ROLEPLAY[g.roleplayStep];
      bubbleB.classList.remove('show');
      bubbleA.textContent = step.a;
      bubbleA.classList.add('show');
      avatarA.classList.add('speaking'); avatarB.classList.remove('speaking');
      speak(step.a);
      optionsBox.innerHTML='';
      const box = document.createElement('div');
      box.className='row-wrap';
      shuffle(step.options).forEach(opt=>{
        const b=document.createElement('button');
        b.className='btn'; b.textContent=opt;
        b.onclick=()=>{
          const ok = opt===step.answer;
          if(ok){
            b.classList.add('correct');
            avatarA.classList.remove('speaking'); avatarB.classList.add('speaking');
            bubbleB.textContent = opt; bubbleB.classList.add('show');
            speak(opt);
            setMascot('Richtig! ⭐','success');
            setTimeout(()=>{ g.roleplayStep++; showStep(); }, 900);
          } else {
            b.classList.add('wrong');
            setMascot('Versuch es noch einmal.','error');
            setTimeout(()=>b.classList.remove('wrong'),450);
          }
        };
        box.appendChild(b);
      });
      optionsBox.appendChild(box);
    };
    showStep();
    setMascot('Du bist jetzt Person B. Antworte auf Person A!');
  }
},

/* ---------------- 9: LEXI ALS LERNBEGLEITER (SPRECHEN) ---------------- */
{
  id:'greet-lexi', stage:'SPRECHEN',
  render(root){
    const g = state.greet;
    root.innerHTML = `
      <div class="eyebrow">Sprechen &middot; Szene 9</div>
      <h1 class="scene-title">Triff Lexi!</h1>
      <p class="lead">Lexi begrüßt dich – antworte in echten Sätzen.</p>
      <div class="card" style="padding:22px;" id="chat-log"></div>
      <div class="row-wrap" id="chat-input-row" style="margin-top:16px;"></div>
    `;
    const log = root.querySelector('#chat-log');
    const inputRow = root.querySelector('#chat-input-row');

    const addLexi = (text)=>{
      const row = document.createElement('div');
      row.className='chat-row';
      row.innerHTML = `<div class="chat-avatar">🤖</div><div class="chat-bubble">${text}</div>`;
      log.appendChild(row);
      speak(text);
    };
    const addUser = (text)=>{
      const row = document.createElement('div');
      row.className='chat-row user';
      row.innerHTML = `<div class="chat-avatar user">🧑</div><div class="chat-bubble">${text}</div>`;
      log.appendChild(row);
    };

    const steps = [
      ()=>{
        addLexi('Hallo! Ich heiße Lexi. Wie heißt du?');
        inputRow.innerHTML = `
          <input class="text-input" id="name-input" placeholder="Dein Name …" maxlength="20">
          <button class="btn primary" id="name-go">Antworten</button>
        `;
        root.querySelector('#name-go').onclick = ()=>{
          const val = root.querySelector('#name-input').value.trim();
          if(!val) return;
          g.lexiName = val;
          addUser('Ich heiße '+val+'.');
          inputRow.innerHTML='';
          setTimeout(next, 500);
        };
      },
      ()=>{
        addLexi('Sehr schön, '+ (g.lexiName||'du') +'! 😊');
        inputRow.innerHTML = `<button class="btn primary" id="bye-go">Tschüss sagen 👋</button>`;
        root.querySelector('#bye-go').onclick = ()=>{
          addUser('Tschüss!');
          inputRow.innerHTML='';
          setTimeout(next, 500);
        };
      },
      ()=>{
        addLexi('Tschüss! Bis bald! 👋');
        inputRow.innerHTML = `<p class="lead">Super gemacht! Klick unten auf „Weiter“.</p>`;
        if(!state.xpAwarded['greet-lexi']){ awardXP('greet-lexi',10); }
        setMascot('Du hast dich gerade auf Deutsch vorgestellt! 🎉','success');
      }
    ];
    let idx = 0;
    const next = ()=>{ if(idx<steps.length){ steps[idx](); idx++; } };
    next();
    setMascot('Lexi möchte dich kennenlernen!');
  }
},

/* ---------------- 10: MISSION (MISSION) ---------------- */
{
  id:'greet-mission', stage:'MISSION',
  render(root){
    const g = state.greet;
    root.innerHTML = `
      <div class="eyebrow">🎯 Deine Mission</div>
      <h1 class="scene-title">Du triffst heute eine neue Person</h1>
      <p class="lead">Begrüße die Person, frag nach dem Namen, sag deinen eigenen Namen und verabschiede dich.</p>
      <div id="mission-steps"></div>
    `;
    const box = root.querySelector('#mission-steps');
    const renderSteps = ()=>{
      box.innerHTML='';
      GREET_MISSION.forEach((step,i)=>{
        const div = document.createElement('div');
        const state_ = i<g.missionStep ? 'done' : (i===g.missionStep ? '' : 'pending');
        div.className = 'card mission-step '+state_;
        if(i<g.missionStep){
          div.innerHTML = `<div class="step-label">${step.label} ✓</div><div class="step-prompt">${step.answer}</div>`;
        } else if(i===g.missionStep){
          div.innerHTML = `
            <div class="step-label">${step.label}</div>
            <div class="step-prompt">${step.prompt}</div>
            <div class="row-wrap" id="mission-opts"></div>
          `;
        } else {
          div.innerHTML = `<div class="step-label">${step.label}</div><div class="step-prompt">…</div>`;
        }
        box.appendChild(div);
      });
      if(g.missionStep<GREET_MISSION.length){
        const step = GREET_MISSION[g.missionStep];
        const optsBox = root.querySelector('#mission-opts');
        shuffle(step.options).forEach(opt=>{
          const b=document.createElement('button');
          b.className='btn'; b.textContent=opt;
          b.onclick=()=>{
            const ok = opt===step.answer;
            if(ok){
              b.classList.add('correct');
              speak(opt);
              setMascot('Richtig! ⭐','success');
              setTimeout(()=>{ g.missionStep++; renderSteps(); }, 700);
            } else {
              b.classList.add('wrong');
              setMascot('Versuch es noch einmal.','error');
              setTimeout(()=>b.classList.remove('wrong'),450);
            }
          };
          optsBox.appendChild(b);
        });
      } else if(!g.missionDone){
        g.missionDone = true;
        awardXP('greet-mission', 15);
        setMascot('Mission geschafft! Du hast eine neue Person kennengelernt. 🎉','success');
      }
    };
    renderSteps();
    setMascot('Bereit für deine erste echte Begegnung auf Deutsch?');
  }
},

];

const UNITS = {
  alphabet:{ title:'Deutsch A1 – Das Alphabet', stages:ALPHA_STAGES, scenes:ALPHA_SCENES },
  greeting:{ title:'Deutsch A1 – Begrüßung', stages:GREET_STAGES, scenes:GREET_SCENES }
};

/* ============================================================
   NAVIGATION / RAIL
============================================================ */
function activeScenes(){ return UNITS[state.unit].scenes; }
function activeStages(){ return UNITS[state.unit].stages; }

function buildStops(){
  const stopsEl = document.getElementById('stops');
  stopsEl.innerHTML='';
  activeStages().forEach(s=>{
    const d = document.createElement('div');
    d.className='stop';
    d.dataset.stage=s;
    d.innerHTML = `<div class="dot"></div><div>${s}</div>`;
    stopsEl.appendChild(d);
  });
}
function updateRail(){
  const scenes = activeScenes();
  const stages = activeStages();
  const scene = scenes[state.sceneIndex];
  const stageIdx = stages.indexOf(scene.stage);
  document.querySelectorAll('.stop').forEach((el,i)=>{
    el.classList.toggle('active', i===stageIdx);
    el.classList.toggle('done', i<stageIdx);
  });
  document.getElementById('track-fill').style.width = ((state.sceneIndex)/(scenes.length-1)*100)+'%';
  document.getElementById('scene-counter').textContent = 'Station '+(state.sceneIndex+1)+' / '+scenes.length;
  document.getElementById('nav-progress-label').textContent = scene.stage;
  document.getElementById('rail-title').innerHTML = 'Lernreise &middot; <b>'+UNITS[state.unit].title+'</b>';
}
function updateNav(){
  const scenes = activeScenes();
  document.getElementById('btn-back').disabled = state.sceneIndex===0;
  document.getElementById('btn-start-nav').disabled = state.sceneIndex===0;
  const nextBtn = document.getElementById('btn-next');
  if(state.sceneIndex === scenes.length-1){
    nextBtn.textContent = 'Fertig ✓';
    nextBtn.disabled = true;
  } else {
    nextBtn.textContent = 'Weiter →';
    nextBtn.disabled = false;
  }
}
function goTo(index){
  const scenes = activeScenes();
  if(index<0 || index>=scenes.length) return;
  state.sceneIndex = index;
  const root = document.getElementById('stage-content');
  root.innerHTML='';
  scenes[index].render(root);
  document.getElementById('stage').scrollTop = 0;
  updateRail();
  updateNav();
}
function switchUnit(unitId){
  if(!UNITS[unitId]) return;
  state.unit = unitId;
  state.sceneIndex = 0;
  buildStops();
  goTo(0);
}
document.getElementById('btn-next').onclick = ()=>goTo(state.sceneIndex+1);
document.getElementById('btn-back').onclick = ()=>goTo(state.sceneIndex-1);
document.getElementById('btn-start-nav').onclick = ()=>goTo(0);
document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight') goTo(state.sceneIndex+1);
  if(e.key==='ArrowLeft') goTo(state.sceneIndex-1);
});

buildStops();
updateXPDisplay(false);
goTo(0);
</script>
